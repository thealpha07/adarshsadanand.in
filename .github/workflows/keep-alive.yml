# Supabase pauses free projects after 7 days without activity.
# This reads one public row every 3 days so the database never sits idle.
# It uses only the publishable key, which is public by design.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *" # 03:17 UTC every third day (08:47 IST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one public row
        env:
          URL: https://yccrnabjqjwyqwiwklup.supabase.co
          KEY: sb_publishable_tO4aaZ9oh97xcxIpB84msw_7pu30h89
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/books_public?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase answered $status"
          test "$status" = "200"
